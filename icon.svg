<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pree-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d20"/>
      <stop offset="1" stop-color="#09090a"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#pree-bg)"/>
  <!-- A strip of film: sprocket holes along the top and bottom. -->
  <g fill="#ffffff" fill-opacity="0.16">
    <rect x="19" y="20" width="18" height="12" rx="3"/>
    <rect x="53" y="20" width="18" height="12" rx="3"/>
    <rect x="87" y="20" width="18" height="12" rx="3"/>
    <rect x="121" y="20" width="18" height="12" rx="3"/>
    <rect x="155" y="20" width="18" height="12" rx="3"/>
    <rect x="19" y="160" width="18" height="12" rx="3"/>
    <rect x="53" y="160" width="18" height="12" rx="3"/>
    <rect x="87" y="160" width="18" height="12" rx="3"/>
    <rect x="121" y="160" width="18" height="12" rx="3"/>
    <rect x="155" y="160" width="18" height="12" rx="3"/>
  </g>
  <!-- The eye ("pree": to watch closely); its iris is a play button. -->
  <path d="M28 96 C 54 52, 138 52, 164 96 C 138 140, 54 140, 28 96 Z" fill="none" stroke="#f5f5f7" stroke-width="9" stroke-linejoin="round"/>
