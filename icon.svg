<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="nos-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1733"/>
      <stop offset="1" stop-color="#0d0a10"/>
    </linearGradient>
    <linearGradient id="nos-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1033"/>
      <stop offset="1" stop-color="#4a1d4f"/>
    </linearGradient>
    <linearGradient id="nos-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd66e"/>
      <stop offset="0.55" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ff4f7b"/>
    </linearGradient>
    <clipPath id="nos-screen">
      <rect x="42" y="72" width="86" height="76" rx="16"/>
    </clipPath>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#nos-bg)"/>
  <!-- An old television: rabbit-ear antennae, a cream cabinet and dials. -->
  <g stroke="#f4e9d8" stroke-width="6" stroke-linecap="round">
    <line x1="96" y1="60" x2="72" y2="32"/>
    <line x1="96" y1="60" x2="122" y2="30"/>
  </g>
  <circle cx="72" cy="32" r="5.5" fill="#f4e9d8"/>
  <circle cx="122" cy="30" r="5.5" fill="#f4e9d8"/>
  <rect x="28" y="58" width="136" height="104" rx="24" fill="#f4e9d8"/>
  <!-- On screen, a retro sunset. -->
  <g clip-path="url(#nos-screen)">
    <rect x="42" y="72" width="86" height="76" fill="url(#nos-sky)"/>
    <circle cx="85" cy="130" r="32" fill="url(#nos-sun)"/>
    <g fill="#3d1a48">
      <rect x="42" y="120" width="86" height="3"/>
      <rect x="42" y="128" width="86" height="4"/>
      <rect x="42" y="137" width="86" height="5"/>
    </g>
  </g>
  <circle cx="146" cy="90" r="7" fill="#2b1733"/>
  <circle cx="146" cy="112" r="5" fill="#2b1733" fill-opacity="0.75"/>
  <g fill="#2b1733" fill-opacity="0.35">
    <rect x="138" y="128" width="16" height="3" rx="1.5"/>
    <rect x="138" y="135" width="16" height="3" rx="1.5"/>
    <rect x="138" y="142" width="16" height="3" rx="1.5"/>
  </g>
</svg>
