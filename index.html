<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Nostalgiaa</title>
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Nostalgiaa" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <!-- iOS only takes a PNG here; with an SVG, Add to Home Screen falls
         back to a snapshot of the page. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before first paint, so light-theme users
      // don't get a flash of dark.
      (function () {
        try {
          var t =
            (JSON.parse(localStorage.getItem("tvt:v1") || "{}") || {}).theme ||
            "auto";
          if (t === "auto") {
            t =
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.getElementById("theme-color-meta");
          if (m)
            m.setAttribute("content", t === "light" ? "#f2f2f7" : "#000000");
        } catch (e) {}
      })();
      // Splash hand-off. The film rolls up the screen and the logo and
      // name fade in (pure CSS) while the scripts load. Once the app has
      // mounted (app.jsx calls tvtSplashDone) the film whooshes off the
      // top, the logo and name dissolve, and the backdrop fades away to
      // show the app rising in beneath it: one continuous cross-fade, with
      // nothing measured or swapped, so nothing can pop. Screen entrances
      // wait (tvt-booting) so they play as the splash clears; tvt-intro
      // makes that first entrance a slower, softer fade.
      (function () {
        var start = Date.now();
        var reduce =
          window.matchMedia &&
          matchMedia("(prefers-reduced-motion: reduce)").matches;
        var root = document.documentElement;
        root.classList.add("tvt-booting", "tvt-intro");
        // The name waits for its font, so it never shows in a fallback
        // face and then jumps when Geist arrives.
        var fontsReady = false;
        var onFonts = function () {
          if (fontsReady) return;
          fontsReady = true;
          root.classList.add("tvt-fonts");
        };
        try {
          document.fonts.load('700 34px "Geist"').then(onFonts, onFonts);
        } catch (e) {
          onFonts();
        }
        setTimeout(onFonts, 1500);
        var sub = function (text) {
          var el = document.getElementById("tvt-splash-sub");
          if (el) el.textContent = text;
        };
        var slow = setTimeout(function () {
          sub("Still loading… check your connection");
        }, 12000);
        // No terminal on a phone: if a script fails to compile or crashes
        // on start, say so on the splash instead of loading forever.
        window.addEventListener("error", function (e) {
          if (!document.getElementById("tvt-splash")) return;
          clearTimeout(slow);
          sub("Couldn't start: " + ((e && e.message) || "script error"));
        });
        var finish = function (el) {
          root.classList.remove("tvt-booting");
          if (el) el.remove();
          // The intro entrance has played; later screens rise as usual.
          setTimeout(function () {
            root.classList.remove("tvt-intro");
          }, 1400);
        };
        var leave = function (el) {
          el.classList.add("is-leaving");
          el.setAttribute("aria-hidden", "true");
          // The app starts fading up as soon as the backdrop starts to
          // clear, so the two overlap rather than one following the other.
          setTimeout(
            function () {
              root.classList.remove("tvt-booting");
            },
            reduce ? 0 : 140,
          );
          setTimeout(
            function () {
              finish(el);
            },
            reduce ? 260 : 1000,
          );
        };

        window.tvtSplashDone = function () {
          window.tvtSplashDone = function () {};
          clearTimeout(slow);
          var el = document.getElementById("tvt-splash");
          if (!el) return finish(null);
          el.setAttribute("aria-busy", "false");
          // Let the film roll and the name fade in before it all leaves,
          // even on a fast (cached) load.
          var wait = reduce ? 0 : Math.max(0, 1700 - (Date.now() - start));
          setTimeout(function () {
            leave(el);
          }, wait);
        };
      })();
    </script>
  </head>
  <body>
    <!-- Loading screen: an overlay above the app (not inside #root), so it
         can hand over to the header logo after React mounts. -->
    <div id="tvt-splash" class="tvt-splash" role="status" aria-busy="true">
      <div class="tvt-film" aria-hidden="true">
        <div class="tvt-film-track">
          <div class="tvt-film-reel" id="tvt-film-reel"></div>
        </div>
      </div>
      <script>
        // The film's frames: posters from your library (the ones you
        // touched last), else colours. Each set appears twice, so the reel
        // can loop without a seam (styles.css).
        (function () {
          var reel = document.getElementById("tvt-film-reel");
          var posters = [];
          try {
            var items =
              (JSON.parse(localStorage.getItem("tvt:v1") || "{}") || {})
                .items || [];
            posters = items
              .filter(function (i) {
                return (
                  i && typeof i.poster === "string" && /^\/[\w.-]+$/.test(i.poster)
                );
              })
              .sort(function (a, b) {
                return String(b.updated).localeCompare(String(a.updated));
              })
              .slice(0, 6)
              .map(function (i) {
                return i.poster;
              });
          } catch (e) {}
          var html = "";
          for (var k = 0; k < 2; k++) {
            for (var i = 0; i < 6; i++) {
              var p = posters[i];
              html +=
                '<i class="tvt-frame" style="--h: ' +
                ((i * 61 + 25) % 360) +
                '">' +
                (p
                  ? '<img alt="" src="https://image.tmdb.org/t/p/w185' +
                    p +
                    '" onload="this.style.opacity=1" />'
                  : "") +
                "</i>";
            }
          }
          reel.innerHTML = html;
        })();
      </script>
      <div class="tvt-splash-center">
        <!-- The app icon (icon.svg). -->
        <div class="tvt-brand" aria-hidden="true">
          <span class="tvt-brand-glow"></span>
          <svg viewBox="0 0 192 192" width="92" height="92">
            <defs>
            <linearGradient id="tvt-splash-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2b1733"/>
            <stop offset="1" stop-color="#0d0a10"/>
            </linearGradient>
            <linearGradient id="tvt-splash-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1c1033"/>
            <stop offset="1" stop-color="#4a1d4f"/>
            </linearGradient>
            <linearGradient id="tvt-splash-sun" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd66e"/>
            <stop offset="0.55" stop-color="#ff8a4c"/>
            <stop offset="1" stop-color="#ff4f7b"/>
            </linearGradient>
            <clipPath id="tvt-splash-screen">
            <rect x="42" y="72" width="86" height="76" rx="16"/>
            </clipPath>
            </defs>
            <rect width="192" height="192" rx="42" fill="url(#tvt-splash-bg)"/>
            <g stroke="#f4e9d8" stroke-width="6" stroke-linecap="round">
            <line x1="96" y1="60" x2="72" y2="32"/>
            <line x1="96" y1="60" x2="122" y2="30"/>
            </g>
            <circle cx="72" cy="32" r="5.5" fill="#f4e9d8"/>
            <circle cx="122" cy="30" r="5.5" fill="#f4e9d8"/>
            <rect x="28" y="58" width="136" height="104" rx="24" fill="#f4e9d8"/>
            <g clip-path="url(#tvt-splash-screen)">
            <rect x="42" y="72" width="86" height="76" fill="url(#tvt-splash-sky)"/>
            <g class="tvt-brand-sun">
            <circle cx="85" cy="130" r="32" fill="url(#tvt-splash-sun)"/>
            <g fill="#3d1a48">
            <rect x="42" y="120" width="86" height="3"/>
            <rect x="42" y="128" width="86" height="4"/>
            <rect x="42" y="137" width="86" height="5"/>
            </g>
            </g>
            </g>
            <circle cx="146" cy="90" r="7" fill="#2b1733"/>
            <circle cx="146" cy="112" r="5" fill="#2b1733" fill-opacity="0.75"/>
            <g fill="#2b1733" fill-opacity="0.35">
            <rect x="138" y="128" width="16" height="3" rx="1.5"/>
            <rect x="138" y="135" width="16" height="3" rx="1.5"/>
            <rect x="138" y="142" width="16" height="3" rx="1.5"/>
            </g>
          </svg>
        </div>
        <div class="tvt-splash-title">Nostalgiaa</div>
        <div class="tvt-splash-sub" id="tvt-splash-sub">
          Loading<span class="tvt-dots" aria-hidden="true"
            ><i></i><i></i><i></i
          ></span>
        </div>
      </div>
    </div>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
      crossorigin="anonymous"
    ></script>
    <!-- Sign-in and sync. If it can't load (offline on a first visit), the
         app still runs, device-only. -->
    <script
      src="https://unpkg.com/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
      integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <!-- Add a new .jsx file here (before app.jsx) and to ASSETS in sw.js. -->
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="tmdb.jsx"></script>
    <script type="text/babel" src="tvmaze.jsx"></script>
    <script type="text/babel" src="wikidata.jsx"></script>
    <script type="text/babel" src="trakt.jsx"></script>
    <script type="text/babel" src="anilist.jsx"></script>
    <script type="text/babel" src="cloud.jsx"></script>
    <script type="text/babel" src="watchlog.jsx"></script>
    <script type="text/babel" src="detail.jsx"></script>
    <script type="text/babel" src="browse.jsx"></script>
    <script type="text/babel" src="profile.jsx"></script>
    <script type="text/babel" src="activity.jsx"></script>
    <script type="text/babel" src="importcsv.jsx"></script>
    <script type="text/babel" src="books.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>

    <script>
      if (
        "serviceWorker" in navigator &&
        location.protocol !== "blob:" &&
        location.protocol !== "file:"
      ) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
