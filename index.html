<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>pree-it</title>
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="pree-it" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <!-- iOS only takes a PNG here; with an SVG, Add to Home Screen falls
         back to a snapshot of the page. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before first paint, so light-theme users
      // don't get a flash of dark.
      (function () {
        try {
          var t =
            (JSON.parse(localStorage.getItem("tvt:v1") || "{}") || {}).theme ||
            "auto";
          if (t === "auto") {
            t =
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.getElementById("theme-color-meta");
          if (m)
            m.setAttribute("content", t === "light" ? "#f2f2f7" : "#000000");
        } catch (e) {}
      })();
      // Splash hand-off. The film rolls up the screen and the logo pops in
      // (pure CSS) while the scripts load. Once the app has mounted
      // (app.jsx calls tvtSplashDone) the film whooshes up and off the top,
      // and the logo and name glide up into the header while the page
      // rises in behind them. Screen entrances wait (tvt-booting) so they
      // play as the splash clears; tvt-intro makes that first entrance
      // rise further and slower, following the film.
      (function () {
        var start = Date.now();
        var reduce =
          window.matchMedia &&
          matchMedia("(prefers-reduced-motion: reduce)").matches;
        var root = document.documentElement;
        root.classList.add("tvt-booting", "tvt-intro");
        var sub = function (text) {
          var el = document.getElementById("tvt-splash-sub");
          if (el) el.textContent = text;
        };
        var slow = setTimeout(function () {
          sub("Still loading… check your connection");
        }, 12000);
        // No terminal on a phone: if a script fails to compile or crashes
        // on start, say so on the splash instead of loading forever.
        window.addEventListener("error", function (e) {
          if (!document.getElementById("tvt-splash")) return;
          clearTimeout(slow);
          sub("Couldn't start: " + ((e && e.message) || "script error"));
        });
        var finish = function (el) {
          root.classList.remove("tvt-booting", "tvt-handoff");
          if (el) el.remove();
          // The intro entrance has played; later screens rise as usual.
          setTimeout(function () {
            root.classList.remove("tvt-intro");
          }, 1400);
        };
        var rect = function (n) {
          var r = n && n.getBoundingClientRect();
          return r && r.width > 0 && r.height > 0 ? r : null;
        };
        // Plain fade, for reduced motion or when there's nothing to fly to.
        var fadeOut = function (el) {
          el.classList.add("is-leaving");
          root.classList.remove("tvt-booting");
          setTimeout(function () {
            finish(el);
          }, 460);
        };

        var flyHome = function (el) {
          var brand = el.querySelector(".tvt-brand");
          var title = el.querySelector(".tvt-splash-title");
          var toLogo = document.querySelector('[data-splash-target="logo"]');
          var toTitle = document.querySelector('[data-splash-target="title"]');
          var a = rect(brand);
          var b = rect(toLogo);
          if (reduce || !brand.animate || !a || !b) return fadeOut(el);
          var ms = 900;
          var s = b.width / a.width;
          var dx = b.left + b.width / 2 - (a.left + a.width / 2);
          var dy = b.top + b.height / 2 - (a.top + a.height / 2);
          var svg = brand.querySelector("svg");
          var radius =
            parseFloat(getComputedStyle(toLogo).borderTopLeftRadius) || 0;
          brand.style.animation = "none";
          root.classList.add("tvt-handoff");
          // The film leaves and the backdrop clears (styles.css).
          el.classList.add("is-flying");
          el.setAttribute("aria-hidden", "true");
          // The logo is swept up with the film, tilting with it, then
          // breaks away and glides across onto the header logo, landing
          // with a touch of overshoot.
          var flight = brand.animate(
            [
              { transform: "none", easing: "cubic-bezier(0.5, 0, 0.75, 0.4)" },
              {
                offset: 0.4,
                transform:
                  "translate(" +
                  (dx * 0.12).toFixed(1) +
                  "px, " +
                  (dy * 0.5).toFixed(1) +
                  "px) rotate(-9deg) scale(" +
                  (1 + (s - 1) * 0.45).toFixed(3) +
                  ")",
                easing: "cubic-bezier(0.2, 0.9, 0.3, 1.18)",
              },
              {
                transform:
                  "translate(" +
                  dx.toFixed(1) +
                  "px, " +
                  dy.toFixed(1) +
                  "px) scale(" +
                  s.toFixed(4) +
                  ")",
              },
            ],
            { duration: ms, fill: "forwards" },
          );
          if (svg) {
            svg.animate(
              [
                { borderRadius: getComputedStyle(svg).borderTopLeftRadius },
                { borderRadius: radius / s + "px", boxShadow: "none" },
              ],
              { duration: ms, easing: "ease-in-out", fill: "forwards" },
            );
          }
          var c = rect(title);
          var d = rect(toTitle);
          if (c && d) {
            // The header title is left-aligned and smaller, so pin the
            // left edge. It follows a beat behind the logo.
            var ts =
              parseFloat(getComputedStyle(toTitle).fontSize) /
              parseFloat(getComputedStyle(title).fontSize);
            var tx = d.left - c.left;
            var ty = d.top + d.height / 2 - (c.top + c.height / 2);
            title.animate(
              [
                { transform: "none", easing: "cubic-bezier(0.5, 0, 0.75, 0.4)" },
                {
                  offset: 0.4,
                  transform:
                    "translate(" +
                    (tx * 0.1).toFixed(1) +
                    "px, " +
                    (ty * 0.5).toFixed(1) +
                    "px) scale(" +
                    (1 + (ts - 1) * 0.5).toFixed(3) +
                    ")",
                  easing: "cubic-bezier(0.2, 0.9, 0.3, 1.12)",
                },
                {
                  transform:
                    "translate(" +
                    tx.toFixed(1) +
                    "px, " +
                    ty.toFixed(1) +
                    "px) scale(" +
                    ts.toFixed(4) +
                    ")",
                },
              ],
              { duration: ms - 80, delay: 80, fill: "forwards" },
            );
          } else {
            title.style.opacity = "0";
          }
          // The page starts rising in once the film is on its way out.
          setTimeout(function () {
            root.classList.remove("tvt-booting");
          }, ms * 0.35);
          // Swap to the real header logo on the flight's last frame; the
          // timer is the backstop.
          var landed = false;
          var onLand = function () {
            if (landed) return;
            landed = true;
            finish(el);
            toLogo.classList.add("tvt-landed");
          };
          flight.onfinish = onLand;
          setTimeout(onLand, ms + 250);
        };

        window.tvtSplashDone = function () {
          window.tvtSplashDone = function () {};
          clearTimeout(slow);
          var el = document.getElementById("tvt-splash");
          if (!el) return finish(null);
          el.setAttribute("aria-busy", "false");
          // Let the film roll and the name spell itself out before it all
          // leaves, even on a fast (cached) load.
          var wait = reduce ? 0 : Math.max(0, 1650 - (Date.now() - start));
          setTimeout(function () {
            flyHome(el);
          }, wait);
        };
      })();
    </script>
  </head>
  <body>
    <!-- Loading screen: an overlay above the app (not inside #root), so it
         can hand over to the header logo after React mounts. -->
    <div id="tvt-splash" class="tvt-splash" role="status" aria-busy="true">
      <div class="tvt-film" aria-hidden="true">
        <div class="tvt-film-track">
          <div class="tvt-film-reel" id="tvt-film-reel"></div>
        </div>
      </div>
      <script>
        // The film's frames: posters from your library (the ones you
        // touched last), else colours. Each set appears twice, so the reel
        // can loop without a seam (styles.css).
        (function () {
          var reel = document.getElementById("tvt-film-reel");
          var posters = [];
          try {
            var items =
              (JSON.parse(localStorage.getItem("tvt:v1") || "{}") || {})
                .items || [];
            posters = items
              .filter(function (i) {
                return (
                  i && typeof i.poster === "string" && /^\/[\w.-]+$/.test(i.poster)
                );
              })
              .sort(function (a, b) {
                return String(b.updated).localeCompare(String(a.updated));
              })
              .slice(0, 6)
              .map(function (i) {
                return i.poster;
              });
          } catch (e) {}
          var html = "";
          for (var k = 0; k < 2; k++) {
            for (var i = 0; i < 6; i++) {
              var p = posters[i];
              html +=
                '<i class="tvt-frame" style="--h: ' +
                ((i * 61 + 25) % 360) +
                '">' +
                (p
                  ? '<img alt="" src="https://image.tmdb.org/t/p/w185' +
                    p +
                    '" onload="this.style.opacity=1" />'
                  : "") +
                "</i>";
            }
          }
          reel.innerHTML = html;
        })();
      </script>
      <div class="tvt-splash-center">
        <!-- The app icon (icon.svg). -->
        <div class="tvt-brand" aria-hidden="true">
          <span class="tvt-brand-glow"></span>
          <svg viewBox="0 0 192 192" width="92" height="92">
            <defs>
              <linearGradient id="tvt-splash-bg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#1d1d20" />
                <stop offset="1" stop-color="#09090a" />
              </linearGradient>
            </defs>
            <rect width="192" height="192" rx="42" fill="url(#tvt-splash-bg)" />
            <g fill="#ffffff" fill-opacity="0.16">
              <rect x="19" y="20" width="18" height="12" rx="3" />
              <rect x="53" y="20" width="18" height="12" rx="3" />
              <rect x="87" y="20" width="18" height="12" rx="3" />
              <rect x="121" y="20" width="18" height="12" rx="3" />
              <rect x="155" y="20" width="18" height="12" rx="3" />
              <rect x="19" y="160" width="18" height="12" rx="3" />
              <rect x="53" y="160" width="18" height="12" rx="3" />
              <rect x="87" y="160" width="18" height="12" rx="3" />
              <rect x="121" y="160" width="18" height="12" rx="3" />
              <rect x="155" y="160" width="18" height="12" rx="3" />
            </g>
            <path
              d="M28 96 C 54 52, 138 52, 164 96 C 138 140, 54 140, 28 96 Z"
              fill="none"
              stroke="#f5f5f7"
              stroke-width="9"
              stroke-linejoin="round"
            />
            <g class="tvt-brand-iris">
              <circle cx="96" cy="96" r="27" fill="#ff9f0a" />
              <path
                d="M89 83 L89 109 L110 96 Z"
                fill="#0b0b0c"
                stroke="#0b0b0c"
                stroke-width="5"
                stroke-linejoin="round"
              />
            </g>
          </svg>
        </div>
        <div class="tvt-splash-title">
          <span class="sr-only">pree-it</span
          ><span aria-hidden="true" class="tvt-letters"
            ><span style="--d: 0">p</span><span style="--d: 1">r</span
            ><span style="--d: 2">e</span><span style="--d: 3">e</span
            ><span style="--d: 4" class="tvt-dash">-</span
            ><span style="--d: 5">i</span><span style="--d: 6">t</span></span
          >
        </div>
        <div class="tvt-splash-sub" id="tvt-splash-sub">
          Loading<span class="tvt-dots" aria-hidden="true"
            ><i></i><i></i><i></i
          ></span>
        </div>
      </div>
    </div>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
      crossorigin="anonymous"
    ></script>
    <!-- Sign-in and sync. If it can't load (offline on a first visit), the
         app still runs, device-only. -->
    <script
      src="https://unpkg.com/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
      integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <!-- Add a new .jsx file here (before app.jsx) and to ASSETS in sw.js. -->
    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="tmdb.jsx"></script>
    <script type="text/babel" src="tvmaze.jsx"></script>
    <script type="text/babel" src="wikidata.jsx"></script>
    <script type="text/babel" src="trakt.jsx"></script>
    <script type="text/babel" src="cloud.jsx"></script>
    <script type="text/babel" src="detail.jsx"></script>
    <script type="text/babel" src="browse.jsx"></script>
    <script type="text/babel" src="profile.jsx"></script>
    <script type="text/babel" src="importcsv.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>

    <script>
      if (
        "serviceWorker" in navigator &&
        location.protocol !== "blob:" &&
        location.protocol !== "file:"
      ) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
